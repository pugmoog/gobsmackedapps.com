<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Recipe Hog Recipe</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 20px; line-height: 1.45; }
    .notice { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid #e97824; border-radius: 12px; }
    .notice-icon { display: grid; flex: 0 0 22px; width: 22px; height: 22px; place-items: center; border: 2px solid currentColor; border-radius: 50%; font-weight: 700; }
    a { color: #e97824; }
    h1 { margin-bottom: 6px; }
    h2 { margin-top: 28px; color: #e97824; }
    #recipe-image { display: none; width: 100%; max-height: 440px; margin-top: 20px; border-radius: 16px; object-fit: cover; }
    .lines { white-space: pre-wrap; }
    .source { margin-top: 32px; font-size: .85rem; opacity: .7; }
    .error { margin-top: 28px; color: #d6422b; }
  </style>
</head>
<body>
  <div class="notice">
    <span class="notice-icon" aria-hidden="true">!</span>
    <span>This recipe page was generated by <a href="https://apps.apple.com/app/id6798717648">Recipe Hog</a>.</span>
  </div>

  <main id="recipe" hidden>
    <img id="recipe-image" alt="Recipe image">
    <h1 id="name"></h1>
    <div id="info" class="lines"></div>
    <section><h2>Ingredients</h2><div id="ingredients" class="lines"></div></section>
    <section><h2>Instructions</h2><div id="instructions" class="lines"></div></section>
    <section id="notes-section"><h2>Notes</h2><div id="notes" class="lines"></div></section>
    <div class="source">Source: <span id="source"></span></div>
  </main>
  <p id="error" class="error" hidden>This recipe link is invalid or incomplete.</p>

  <script>
    (async () => {
      const decodeBase16384 = (value) => {
        if (!/^[0-9a-d]/.test(value) || value.length > 500001) throw new Error('Invalid payload');
        const padding = parseInt(value[0], 16);
        const totalBits = (value.length - 1) * 14 - padding;
        if (totalBits < 0 || totalBits % 8 || (value.length === 1 && padding)) throw new Error('Invalid length');
        const bytes = [];
        let buffer = 0, bits = 0;
        for (let i = 1; i < value.length; i++) {
          const symbol = value.charCodeAt(i) - 0x4E00;
          if (symbol < 0 || symbol >= 16384) throw new Error('Invalid symbol');
          const last = i === value.length - 1;
          if (last && (symbol & ((1 << padding) - 1))) throw new Error('Invalid padding');
          const width = last ? 14 - padding : 14;
          buffer = (buffer << width) | (last ? symbol >> padding : symbol);
          bits += width;
          while (bits >= 8) {
            bits -= 8;
            bytes.push(buffer >> bits);
            buffer &= (1 << bits) - 1;
          }
        }
        return Uint8Array.from(bytes);
      };
      const decodeBase32768 = (value) => {
        if (!/^[0-9a-e]/.test(value) || value.length > 500001) throw new Error('Invalid payload');
        const padding = parseInt(value[0], 16);
        const totalBits = (value.length - 1) * 15 - padding;
        if (totalBits < 0 || totalBits % 8 || (value.length === 1 && padding)) throw new Error('Invalid length');
        const bytes = [];
        let buffer = 0, bits = 0;
        for (let i = 1; i < value.length; i++) {
          const code = value.charCodeAt(i);
          const symbol = code >= 0x3400 && code <= 0x9FFF ? code - 0x3400
            : code >= 0xAC00 && code <= 0xBFFF ? code - 0xAC00 + 0x6C00 : -1;
          if (symbol < 0 || symbol >= 32768) throw new Error('Invalid symbol');
          const last = i === value.length - 1;
          if (last && (symbol & ((1 << padding) - 1))) throw new Error('Invalid padding');
          const width = last ? 15 - padding : 15;
          buffer = (buffer << width) | (last ? symbol >> padding : symbol);
          bits += width;
          while (bits >= 8) {
            bits -= 8;
            bytes.push(buffer >> bits);
            buffer &= (1 << bits) - 1;
          }
        }
        return Uint8Array.from(bytes);
      };
      // qntm/base32768, MIT. See BASE32768-LICENSE.txt.
      const stableSymbols = new Map();
      ['ҠҿԀԟڀڿݠޟ߀ߟကဟႠႿᄀᅟᆀᆟᇠሿበቿዠዿጠጿᎠᏟᐠᙟᚠᛟកសᠠᡟᣀᣟᦀᦟ᧠᧿ᨠᨿᯀᯟᰀᰟᴀᴟ⇠⇿⋀⋟⍀⏟␀␟─❟➀➿⠀⥿⦠⦿⨠⩟⪀⪿⫠⭟ⰀⰟⲀⳟⴀⴟⵀⵟ⺠⻟㇀㇟㐀䶟䷀龿ꀀꑿ꒠꒿ꔀꗿꙀꙟꚠꛟ꜀ꝟꞀꞟꡀꡟ', 'ƀƟɀʟ'].forEach((pairs, repertoire) => {
        let value = 0;
        for (let i = 0; i < pairs.length; i += 2) {
          for (let code = pairs.charCodeAt(i); code <= pairs.charCodeAt(i + 1); code++) {
            stableSymbols.set(code, [repertoire === 0 ? 15 : 7, value++]);
          }
        }
      });
      const decodeStableBase32768 = (text) => {
        if (text.length > 502000) throw new Error('Payload too large');
        const value = text.replace(/-/g, '');
        if (value.length > 500000) throw new Error('Payload too large');
        const bytes = [];
        let buffer = 0, bits = 0;
        for (let i = 0; i < value.length; i++) {
          const symbol = stableSymbols.get(value.charCodeAt(i));
          if (!symbol || (symbol[0] !== 15 && i !== value.length - 1)) throw new Error('Invalid symbol');
          buffer = (buffer << symbol[0]) | symbol[1];
          bits += symbol[0];
          while (bits >= 8) {
            bits -= 8;
            bytes.push(buffer >> bits);
            buffer &= (1 << bits) - 1;
          }
        }
        if (buffer !== (1 << bits) - 1) throw new Error('Invalid padding');
        return Uint8Array.from(bytes);
      };
      const inflateRaw = async (bytes) => {
        const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
        const chunks = [];
        let size = 0;
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            size += value.length;
            if (size > 1048576) {
              await reader.cancel();
              throw new Error('Recipe is too large');
            }
            chunks.push(value);
          }
        } finally { reader.releaseLock(); }
        const output = new Uint8Array(size);
        let offset = 0;
        for (const chunk of chunks) { output.set(chunk, offset); offset += chunk.length; }
        return output;
      };
      const decodeBase64URL = (value) => {
        const base64 = value.replace(/-/g, '+').replace(/_/g, '/')
          + '='.repeat((4 - value.length % 4) % 4);
        return Uint8Array.from(atob(base64), character => character.charCodeAt(0));
      };
      const decodeText = (value) => new TextDecoder().decode(decodeBase64URL(value));
      const setText = (id, value) => { document.getElementById(id).textContent = value || ''; };

      try {
        const fragment = decodeURIComponent(location.hash.slice(1));
        let metadata;
        let imageBytes;
        if (fragment.startsWith('6.')) {
          if (fragment.length > 1500000) throw new Error('Payload too large');
          const payload = fragment.slice(2).replace(/-/g, '');
          if (!/^[A-Za-z0-9+/]*$/.test(payload)) throw new Error('Invalid Base64 payload');
          const bytes = await inflateRaw(decodeBase64URL(payload));
          metadata = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
          if (metadata.v !== 2) throw new Error('Unsupported recipe link');
        } else if (fragment.startsWith('5.')) {
          const bytes = await inflateRaw(decodeStableBase32768(fragment.slice(2)));
          metadata = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
          if (metadata.v !== 2) throw new Error('Unsupported recipe link');
        } else if (fragment.startsWith('4.')) {
          const bytes = await inflateRaw(decodeBase32768(fragment.slice(2)));
          metadata = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
          if (metadata.v !== 2) throw new Error('Unsupported recipe link');
        } else if (fragment.startsWith('3.')) {
          metadata = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(decodeBase16384(fragment.slice(2))));
          if (metadata.v !== 2) throw new Error('Unsupported recipe link');
        } else if (fragment && !fragment.includes('.')) {
          metadata = JSON.parse(decodeText(fragment));
          if (metadata.v !== 2) throw new Error('Unsupported recipe link');
        } else {
          // Accept the earlier image-bearing fragment and query formats.
          const payload = new URLSearchParams(location.search).get('recipe') || fragment;
          const parts = payload.split('.');
          if (parts.length !== 3 || parts[0] !== '1') throw new Error('Unsupported recipe link');
          metadata = JSON.parse(decodeText(parts[1]));
          imageBytes = parts[2] ? decodeBase64URL(parts[2]) : null;
        }
        setText('name', metadata.n);
        setText('info', metadata.f);
        setText('ingredients', metadata.i);
        setText('instructions', metadata.d);
        setText('notes', metadata.o);
        setText('source', metadata.s || 'unknown');
        document.getElementById('notes-section').hidden = !metadata.o;

        if (imageBytes && imageBytes.length) {
          const image = document.getElementById('recipe-image');
          image.src = URL.createObjectURL(new Blob([imageBytes], { type: 'image/jpeg' }));
          image.style.display = 'block';
        }
        document.getElementById('recipe').hidden = false;
      } catch (error) {
        document.getElementById('error').hidden = false;
      }
    })();
  </script>
</body>
</html>
